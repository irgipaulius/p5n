[project]
name = "p5n"
version = "0.1.0"
description = "Append-only park4night crawler"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "jinja2>=3.1.0",
  "typer>=0.15.0",
  "zstandard>=0.23.0",
]

[project.scripts]
p5n = "p5n.cli:app"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
p5n = ["templates/*.html"]
